# Dependabot configuration.
#
# `cooldown` makes Dependabot wait until a release has aged before proposing it,
# so freshly-published (and potentially compromised) versions are never adopted
# immediately. We require at least 14 days for every update.
version: 2
updates:
  # Node.js plugins (WhatsApp connector and other npm-based plugins).
  - package-ecosystem: "npm"
    directory: "/plugins/whatsapp/whatsapp-connector"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14

  # Rust workspace.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14

  # GitHub Actions workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
